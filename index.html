    <script>
      (function () {
        var origin = window.location.origin;
        var path = window.location.pathname || "/";
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        if (!redirect) {
          try {
            redirect = window.sessionStorage.getItem("spa-redirect-path");
            if (redirect) window.sessionStorage.removeItem("spa-redirect-path");
          } catch (e) {
            // ignore storage access issues
          }
        }

        // Keep GitHub Pages fallback redirects out of the public URL.
        if (redirect) params.delete("redirect");

        var targetPath = redirect || path;
        if (!targetPath.startsWith("/")) targetPath = "/" + targetPath;
        targetPath = targetPath.toLowerCase();
        if (targetPath.length > 1 && targetPath.endsWith("/")) targetPath = targetPath.slice(0, -1);

        var nextSearch = params.toString();
        var nextUrl = origin + targetPath + (nextSearch ? "?" + nextSearch : "") + (window.location.hash || "");
        var currentUrl = origin + path + window.location.search + (window.location.hash || "");

        if (nextUrl !== currentUrl) {
          window.history.replaceState(null, "", nextUrl);
        }
      })();
    </script>
