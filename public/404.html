<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>West Coast Celebrants</title>
  </head>
  <body>
    <script>
      // GitHub Pages SPA fallback: redirect any unknown path back to index.html
      // while preserving the original path + query + hash for the client router.
      (function () {
        var loc = window.location;
        var redirect = loc.origin + "/?redirect=" + encodeURIComponent(loc.pathname + loc.search + loc.hash);
        loc.replace(redirect);
      })();
    </script>
  </body>
</html>
